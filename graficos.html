    <h1>Victor dos Santos Costa</h1>
    <p class="subtitle">Gráficos</p>
  </header>

  <main>
    <div class="cards-grid">

      <section class="card">
        <h2>Gráfico de Habilidades (Canvas)</h2>
        <p>Um gráfico de barras só pra exemplo.</p>
        <canvas id="skillsCanvas" width="500" height="280"></canvas>
      </section>

      <section class="card">
        <h2>SVG estilizado</h2>
        <p>Um logo simples.</p>
        <svg class="logo-svg" viewBox="0 0 500 100">
          <circle cx="30" cy="30" r="15"></circle>
        </svg>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <ul class="contato-lista">
      <li><a href="https://wa.link/68aj5n" target="_blank" rel="noopener noreferrer">WhatsApp</a></li>
      <li>vsi.gco03@gmail.com</li>
      <li>(11) 97356-3037</li>
    </ul>
    <p>Victor dos Santos Costa.</p>
  </footer>

  <script>
    const canvas = document.getElementById('skillsCanvas');
    const ctx = canvas.getContext('2d');

    const skills = [
      { nome: 'Gráfico de ex 1', nivel: 70 },
      { nome: 'Gráfico de ex 2', nivel: 60 },
      { nome: 'Gráfico de ex 3', nivel: 65 },
      { nome: 'Gráfico de ex 4', nivel: 40 }
    ];

    const larguraBarra = 70;
    const espaco = 40;
    const alturaMax = 180;
    const baseY = 220;

    ctx.font = '14px system-ui, sans-serif';

    skills.forEach((skill, i) => {
      const x = espaco + i * (larguraBarra + espaco);
      const alturaBarra = (skill.nivel / 100) * alturaMax;
      const y = baseY - alturaBarra;

      ctx.fillStyle = '#3498db';
      ctx.fillRect(x, y, larguraBarra, alturaBarra);

      ctx.fillStyle = '#333';
      ctx.textAlign = 'center';
      ctx.fillText(skill.nivel + '%', x + larguraBarra / 2, y - 8);
    });

    ctx.strokeStyle = '#999';
    ctx.beginPath();
    ctx.moveTo(20, baseY);
    ctx.lineTo(480, baseY);
    ctx.stroke();
  </script>

</body>
</html>
